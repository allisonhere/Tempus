# Builds Tempus.zip when a version tag (v2.1.0 etc.) is pushed, attaches it to a GitHub
# release and uploads it to CurseForge (project ID from Tempus.toc, CF_API_KEY secret).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
